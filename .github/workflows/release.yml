name: Release to App Store

on:
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: Submit the build for App Review after upload
        type: boolean
        default: false

concurrency:
  group: app-store-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CHIRP_TEAM_ID: ${{ vars.CHIRP_TEAM_ID }}
      MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
      SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
    steps:
      - uses: actions/checkout@v5

      - name: Write Config/Local.xcconfig
        env:
          ARENA_CLIENT_ID: ${{ vars.ARENA_CLIENT_ID }}
        run: |
          printf 'CHIRP_TEAM_ID = %s\nARENA_CLIENT_ID = %s\n' \
            "$CHIRP_TEAM_ID" "$ARENA_CLIENT_ID" > Config/Local.xcconfig

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      # Ruby from .ruby-version, gems from Gemfile.lock (cached).
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.232.0
        with:
          bundler-cache: true

      # match clones the certificates repo over SSH; trust GitHub's published
      # host keys rather than whatever ssh-keyscan returns.
      - name: Trust github.com SSH host keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.ssh
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >> ~/.ssh/known_hosts

      - name: Build and upload
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_AUTH_KEY: ${{ secrets.APPSTORE_AUTH_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
        run: bundle exec fastlane ios release
